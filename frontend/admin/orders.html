<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Orders — ScanBite Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
</head>

<body class="admin-body">

    <div id="sidebarMount"></div>

    <div class="admin-main" id="adminMain">
        <div class="admin-topbar">
            <div class="admin-topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
                <div class="page-title">Orders</div>
                <div class="page-subtitle" id="ordersSubtitle">Auto-refreshes every 15 seconds</div>
            </div>
            <div class="admin-topbar-right">
                <div id="liveClock"
                    style="font-weight:600; font-size:1rem; color:var(--primary); margin-right:20px; border-right:1px solid var(--border); padding-right:20px">
                    --:-- --</div>
                <span id="lastRefreshed" style="font-size:.78rem;color:var(--muted)"></span>
                <button class="btn btn-primary btn-sm" id="refreshOrdersBtn" aria-label="Refresh orders now">🔄
                    Refresh</button>
            </div>
        </div>

        <div id="toast-container" aria-live="polite"></div>

        <!-- Bulk Actions & Select All -->
        <div id="bulkActionsPanel"
            style="display:none; background:var(--bg); border:1px solid var(--border); padding:12px 18px; border-radius:12px; margin-bottom:20px; align-items:center; justify-content:space-between; animation: slideDown 0.3s ease;">
            <div style="display:flex; align-items:center; gap:12px">
                <label style="display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer">
                    <input type="checkbox" id="selectAllOrders" style="width:18px;height:18px" />
                    Select All
                </label>
                <span id="selectedCount" style="font-size:.85rem; color:var(--muted); margin-left:10px">0
                    selected</span>
            </div>
            <button class="btn btn-danger btn-sm" id="deleteSelectedBtn" style="padding: 8px 16px">🗑️ Delete
                Selected</button>
        </div>

        <!-- Filter tabs -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px" role="tablist"
            aria-label="Order filter tabs">
            <button class="btn btn-primary btn-sm active-tab" data-filter="all" role="tab" aria-selected="true"
                id="filterAll">All</button>
            <button class="btn btn-ghost  btn-sm" data-filter="Pending" role="tab" aria-selected="false"
                id="filterPending">⏳ Pending</button>
            <button class="btn btn-ghost  btn-sm" data-filter="Preparing" role="tab" aria-selected="false"
                id="filterPreparing">👨‍🍳 Preparing</button>
            <button class="btn btn-ghost  btn-sm" data-filter="Served" role="tab" aria-selected="false"
                id="filterServed">✅ Served</button>
            <button class="btn btn-ghost  btn-sm" data-filter="Paid" role="tab" aria-selected="false" id="filterPaid">💳
                Paid</button>
            <button class="btn btn-ghost  btn-sm" data-filter="Cancelled" role="tab" aria-selected="false"
                id="filterCancelled">❌ Cancelled</button>
        </div>

        <!-- Orders board -->
        <div class="orders-board" id="ordersBoard" aria-label="Orders board">
            <div class="empty-state" id="ordersEmpty">
                <div class="empty-state-icon" aria-hidden="true">🔔</div>
                <div class="empty-state-title">No orders yet</div>
                <div class="empty-state-desc">Orders placed by customers will appear here</div>
            </div>
        </div>
    </div>

    <script src="/assets/js/admin-utils.js"></script>
    <script src="/assets/js/orders-admin.js"></script>
</body>

</html>
