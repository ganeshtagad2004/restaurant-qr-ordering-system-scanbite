<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register your restaurant on ScanBite." />
    <title>Register — ScanBite Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet" />

    <style>
        /* ── Reset & Tokens (Matching index.html) ────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #faf8f5;
            color: #2d2d2d;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        :root {
            --primary: #ff6b35;
            --primary-dark: #e85d2e;
            --primary-light: #fff1eb;
            --dark: #1a1a2e;
            --text: #2d2d2d;
            --muted: #8892a4;
            --border: #eef0f4;
            --card: #ffffff;
            --radius: 14px;
            --radius-lg: 22px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.14);
        }

        /* ── Auth Card ────────────────────────────────────────── */
        .auth-card {
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-hover);
            padding: 40px;
            border: 1px solid var(--border);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .auth-logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
        }

        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--muted);
        }

        /* ── Form ─────────────────────────────────────────────── */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-label span {
            color: var(--primary);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: #fdfdfd;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .form-input.error,
        .form-textarea.error {
            border-color: #e74c3c;
            background: #fffcfc;
        }

        .field-error {
            display: none;
            font-size: 0.75rem;
            color: #e74c3c;
            margin-top: 6px;
            font-weight: 500;
        }

        .field-error.show {
            display: block;
        }

        /* ── Link Preview ────────────────────────────────────── */
        .slug-preview {
            display: none;
            margin-top: 8px;
            background: #fdfaf3;
            border: 1px solid #fae7c3;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.75rem;
            color: #8c6d1f;
            word-break: break-all;
        }

        .slug-preview.show {
            display: block;
        }

        .slug-preview strong {
            color: var(--primary-dark);
        }

        /* ── Password Rules ─────────────────────────────────── */
        .pw-rules {
            display: none;
            margin-top: 10px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
        }

        .pw-rules.show {
            display: block;
        }

        .pw-rules-title {
            font-size: 0.6875rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .rule {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .rule.valid {
            color: #10b981;
        }

        .rule.valid .rule-dot::before {
            content: '✓';
            font-weight: 700;
        }

        .rule:not(.valid) .rule-dot::before {
            content: '○';
        }

        /* ── Button ───────────────────────────────────────────── */
        .btn-primary {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Footer ───────────────────────────────────────────── */
        .auth-footer {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 24px;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
        }

        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 0.875rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Toast Container ─────────────────────────────────── */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
            min-width: 280px;
            max-width: 360px;
            pointer-events: all;
            animation: toast-in .35s cubic-bezier(.34, 1.56, .64, 1) forwards;
            border-left: 4px solid transparent;
            position: relative;
            overflow: hidden;
            color: #2d2d2d;
            text-align: left;
        }

        .toast.removing {
            animation: toast-out .2s ease forwards;
        }

        .toast-icon {
            font-size: 1.15rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .toast-body {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: .875rem;
            margin-bottom: 2px;
        }

        .toast-msg {
            font-size: .78rem;
            color: var(--muted);
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: .95rem;
            padding: 0;
        }

        .toast-success {
            border-left-color: #27ae60;
        }

        .toast-success .toast-icon {
            color: #27ae60;
        }

        .toast-error {
            border-left-color: #e74c3c;
        }

        .toast-error .toast-icon {
            color: #e74c3c;
        }

        .toast-info {
            border-left-color: #2980b9;
        }

        .toast-info .toast-icon {
            color: #2980b9;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(110%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toast-out {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(110%);
            }
        }

        @media (max-width: 480px) {
            form {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <a href="/" class="back-home">
        <span>←</span> Back to Home
    </a>

    <div id="toast-container" aria-live="polite"></div>

    <main class="auth-card">
        <header class="auth-header">
            <div class="auth-logo">
                <div class="auth-logo-icon">🌿</div>
                <div class="auth-logo-name">ScanBite</div>
            </div>
            <h1 class="auth-title">Create Restaurant</h1>
            <p class="auth-subtitle">Get started with our premium QR ordering system</p>
        </header>

        <form id="registerForm" novalidate action="/api/auth/register" method="POST">
            <div class="form-group form-full">
                <label class="form-label" for="gx_reg_shop">Restaurant Name <span>*</span></label>
                <input class="form-input" type="text" id="gx_reg_shop" name="restaurantName"
                    placeholder="e.g. Spice Route" required />
                <div class="slug-preview" id="slugPreview"></div>
                <div class="field-error" id="restaurantError"></div>
            </div>

            <div class="form-group form-full">
                <label class="form-label" for="gx_reg_owner">Admin Full Name <span>*</span></label>
                <input class="form-input" type="text" id="gx_reg_owner" name="adminName" placeholder="e.g. Rahul Sharma"
                    autocomplete="name" required />
                <div class="field-error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="gx_reg_mail">Email Address <span>*</span></label>
                <input class="form-input" type="email" id="gx_reg_mail" name="email" placeholder="owner@restaurant.com"
                    autocomplete="email" required />
                <div class="field-error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="gx_reg_cell">Phone Number <span>*</span></label>
                <input class="form-input" type="tel" id="gx_reg_cell" name="phone" placeholder="9876543210"
                    maxlength="10" autocomplete="tel" required />
                <div class="field-error" id="phoneError"></div>
            </div>

            <div class="form-group form-full">
                <label class="form-label" for="gx_reg_loc">Restaurant Address <span>*</span></label>
                <textarea class="form-textarea" id="gx_reg_loc" name="address"
                    placeholder="Full address of your restaurant…" required></textarea>
                <div class="field-error" id="addressError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="gx_reg_pass">Password <span>*</span></label>
                <input class="form-input" type="password" id="gx_reg_pass" name="password" placeholder="••••••••"
                    autocomplete="new-password" required />
                <div class="field-error" id="passwordError"></div>
                <div class="pw-rules" id="pwRulesBox">
                    <div class="pw-rules-title">Password must have</div>
                    <div class="rule" id="rule-length"><span class="rule-dot"></span> 8+ chars</div>
                    <div class="rule" id="rule-capital"><span class="rule-dot"></span> 1 Uppercase</div>
                    <div class="rule" id="rule-number"><span class="rule-dot"></span> 1 Number</div>
                    <div class="rule" id="rule-symbol"><span class="rule-dot"></span> 1 Special (!@#)</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="gx_reg_confirm">Confirm <span>*</span></label>
                <input class="form-input" type="password" id="gx_reg_confirm" name="confirmPassword"
                    placeholder="••••••••" autocomplete="new-password" required />
                <div class="field-error" id="confirmError"></div>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">
                <span class="btn-text">Create Account</span>
            </button>

            <footer class="auth-footer">
                Already have an account? <a href="/auth/login.html">Sign In</a>
            </footer>
        </form>
    </main>

    <script src="/assets/js/auth.js"></script>
</body>

</html>
